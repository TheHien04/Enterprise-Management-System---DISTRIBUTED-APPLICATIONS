services:
  postgres:
    image: postgres:16-alpine
    container_name: udpt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udpt_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: udpt-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: udpt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: udpt-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: udpt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-udpt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-udpt_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api-gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: udpt-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    depends_on:
      - contract-service
      - redis

  contract-service:
    build:
      context: .
      dockerfile: backend/services/contract-service/Dockerfile
    container_name: udpt-contract-service
    ports:
      - "8001:8001"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-udpt_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-udpt_minio_secret}
      MINIO_BUCKET: contracts
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      workflow-service:
        condition: service_started
      minio:
        condition: service_started

  pricing-service:
    build:
      context: .
      dockerfile: backend/services/pricing-service/Dockerfile
    container_name: udpt-pricing-service
    ports:
      - "8002:8002"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  operation-service:
    build:
      context: .
      dockerfile: backend/services/operation-service/Dockerfile
    container_name: udpt-operation-service
    ports:
      - "8003:8003"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: backend/services/billing-service/Dockerfile
    container_name: udpt-billing-service
    ports:
      - "8004:8004"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      pricing-service:
        condition: service_started
      operation-service:
        condition: service_started

  workflow-service:
    build:
      context: .
      dockerfile: backend/services/workflow-service/Dockerfile
    container_name: udpt-workflow-service
    ports:
      - "8005:8005"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    container_name: udpt-notification-service
    ports:
      - "8006:8006"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  audit-service:
    build:
      context: .
      dockerfile: backend/services/audit-service/Dockerfile
    container_name: udpt-audit-service
    ports:
      - "8007:8007"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  esign-service:
    build:
      context: .
      dockerfile: backend/services/esign-service/Dockerfile
    container_name: udpt-esign-service
    ports:
      - "8008:8008"
    env_file:
      - .env.example
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udpt-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  minio_data:

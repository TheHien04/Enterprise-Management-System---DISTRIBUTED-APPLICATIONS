[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udpt-common"
version = "0.1.0"
description = "Shared utilities for UDPT microservices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "sqlalchemy>=2.0.35",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "aiokafka>=0.11.0",
  "minio>=7.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["udpt_common*"]

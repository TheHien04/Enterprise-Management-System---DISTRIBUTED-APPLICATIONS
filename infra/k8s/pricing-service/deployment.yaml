apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: udpt
  labels:
    app: pricing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: udpt-pricing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: CONFIG_DIR
              value: /config
            - name: DATABASE_URL
              value: postgresql+psycopg://udpt:udpt_secret@postgres:5432/pricing_db
            - name: WORKFLOW_SERVICE_URL
              value: http://workflow-service:8005
          volumeMounts:
            - name: app-config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: app-config
          configMap:
            name: udpt-app-config

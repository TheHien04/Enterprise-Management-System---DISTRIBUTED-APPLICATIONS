apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: udpt
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: udpt-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: CONFIG_DIR
              value: /config
            - name: DATABASE_URL
              value: postgresql+psycopg://udpt:udpt_secret@postgres:5432/billing_db
            - name: CONTRACT_SERVICE_URL
              value: http://contract-service:8001
            - name: PRICING_SERVICE_URL
              value: http://pricing-service:8002
            - name: OPERATION_SERVICE_URL
              value: http://operation-service:8003
            - name: WORKFLOW_SERVICE_URL
              value: http://workflow-service:8005
            - name: ESIGN_SERVICE_URL
              value: http://esign-service:8008
          volumeMounts:
            - name: app-config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: app-config
          configMap:
            name: udpt-app-config

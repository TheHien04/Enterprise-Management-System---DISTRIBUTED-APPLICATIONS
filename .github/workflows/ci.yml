name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-compile:
    name: Compile Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend sources
        run: |
          python -m compileall -q backend/gateway backend/libs backend/services backend/tests
      - name: Verify required artefacts
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/UDPT-09-Report.pdf
          test -f docs/ARCHITECTURE.md
          test -f docker-compose.yml
          test -f config/state_machines.json
          test -f config/workflow_definitions.json

  frontend-build:
    name: Build operator portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck and production build
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python compile and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install --quiet "ruff>=0.6"
      - name: Compile backend sources
        run: |
          python -m compileall -q backend/gateway backend/libs backend/services backend/tests
      - name: Lint with Ruff
        run: |
          ruff check backend/gateway backend/libs backend/services backend/tests
      - name: Verify required artefacts
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/UDPT-09-Report.pdf
          test -f docs/ARCHITECTURE.md
          test -f docs/SERVICE_MAP.md
          test -f docs/TEAM_ASSIGNMENT.md
          test -f docker-compose.yml
          test -f Makefile
          test -f .env.example
          test -f config/state_machines.json
          test -f config/workflow_definitions.json
          test -f frontend/package-lock.json
          test -f .github/workflows/ci.yml

  frontend-build:
    name: Build operator portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
